<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="1200" height="470" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="14" fill="none" stroke="#30363d"/>
  <text x="40" y="50" fill="#e6edf3" font-size="26" font-weight="700">How it works</text>

  <!-- BUILD TIME -->
  <text x="40" y="92" fill="#58a6ff" font-size="15" font-weight="700" font-family="Consolas,monospace">BUILD TIME</text>
  <g font-family="Consolas,monospace" font-size="14">
    <!-- source -->
    <g transform="translate(40,108)">
      <rect width="190" height="104" rx="9" fill="#161b22" stroke="#30363d"/>
      <text x="14" y="26" fill="#e6edf3" font-size="14">your source</text>
      <text x="14" y="52" fill="#8b949e">HZ_STR("...")</text>
      <text x="14" y="72" fill="#8b949e">HZ_BLOB(cfg)</text>
      <text x="14" y="92" fill="#8b949e">HZ_DEFINE_STAMP</text>
    </g>
    <!-- tools -->
    <g transform="translate(290,108)">
      <rect width="210" height="104" rx="9" fill="#161b22" stroke="#1f6feb"/>
      <text x="14" y="24" fill="#58a6ff" font-size="13">pre / post build</text>
      <text x="14" y="48" fill="#c9d1d9">hzkeygen  random keys</text>
      <text x="14" y="70" fill="#c9d1d9">hzblob    encrypt asset</text>
      <text x="14" y="92" fill="#c9d1d9">hzstamp   .text SHA-256</text>
    </g>
    <!-- compiler -->
    <g transform="translate(560,128)">
      <rect width="150" height="64" rx="9" fill="#161b22" stroke="#30363d"/>
      <text x="75" y="30" fill="#e6edf3" font-size="14" text-anchor="middle">MSVC x64</text>
      <text x="75" y="52" fill="#8b949e" text-anchor="middle">compile + link</text>
    </g>
    <!-- protected -->
    <g transform="translate(770,120)">
      <rect width="180" height="80" rx="9" fill="#132a17" stroke="#3fb950"/>
      <text x="90" y="32" fill="#3fb950" font-size="15" text-anchor="middle" font-weight="700">protected.exe</text>
      <text x="90" y="56" fill="#8b949e" font-size="13" text-anchor="middle">different every build</text>
    </g>
    <!-- arrows -->
    <g stroke="#6e7681" stroke-width="2" fill="none" marker-end="url(#ah)">
      <path d="M230 160 H288"/><path d="M500 160 H558"/><path d="M710 160 H768"/>
    </g>
  </g>

  <line x1="40" y1="250" x2="1160" y2="250" stroke="#21262d" stroke-width="1.5"/>

  <!-- RUNTIME -->
  <text x="40" y="288" fill="#3fb950" font-size="15" font-weight="700" font-family="Consolas,monospace">RUNTIME — the app checks itself, then runs or bails</text>
  <g font-family="Consolas,monospace" font-size="13.5">
    <g transform="translate(40,308)"><rect width="168" height="70" rx="9" fill="#161b22" stroke="#30363d"/><text x="84" y="30" text-anchor="middle" fill="#e6edf3">🐞 debugger?</text><text x="84" y="52" text-anchor="middle" fill="#8b949e">14 checks</text></g>
    <g transform="translate(224,308)"><rect width="168" height="70" rx="9" fill="#161b22" stroke="#30363d"/><text x="84" y="30" text-anchor="middle" fill="#e6edf3">🖥 VM / sandbox?</text><text x="84" y="52" text-anchor="middle" fill="#8b949e">CPUID</text></g>
    <g transform="translate(408,308)"><rect width="168" height="70" rx="9" fill="#161b22" stroke="#30363d"/><text x="84" y="30" text-anchor="middle" fill="#e6edf3">🪝 WinAPI hooked?</text><text x="84" y="52" text-anchor="middle" fill="#8b949e">disk vs memory</text></g>
    <g transform="translate(592,308)"><rect width="168" height="70" rx="9" fill="#161b22" stroke="#30363d"/><text x="84" y="30" text-anchor="middle" fill="#e6edf3">🔏 patched?</text><text x="84" y="52" text-anchor="middle" fill="#8b949e">SHA-256 stamp</text></g>
    <g transform="translate(776,308)"><rect width="168" height="70" rx="9" fill="#161b22" stroke="#30363d"/><text x="84" y="30" text-anchor="middle" fill="#e6edf3">🪪 licensed?</text><text x="84" y="52" text-anchor="middle" fill="#8b949e">Ed25519 + HWID</text></g>
    <g transform="translate(980,308)"><rect width="180" height="70" rx="9" fill="#132a17" stroke="#3fb950"/><text x="90" y="30" text-anchor="middle" fill="#3fb950" font-weight="700">all clear → run</text><text x="90" y="52" text-anchor="middle" fill="#8b949e">else bail quietly</text></g>
  </g>
  <g font-family="Consolas,monospace" font-size="13" fill="#6e7681">
    <text x="40" y="420">strings &amp; assets stay AES-encrypted on disk · decrypted only in RAM, wiped after use</text>
    <text x="40" y="444" fill="#8b949e">verified: RFC 8032 (Ed25519), FIPS vectors (SHA-256/AES), CI green on windows-latest</text>
  </g>

  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6e7681"/></marker></defs>
</svg>

<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; box-sizing:border-box; }

  .g { background:rgba(35,134,54,.16); color:#56d364; border:1px solid rgba(35,134,54,.45); }
  .foot { position:absolute; left:80px; bottom:58px; font-family:Consolas,monospace; font-size:26px; color:#8b949e; }
  .foot b { color:#58a6ff; }
  .hex { position:absolute; right:70px; bottom:56px; font-family:Consolas,monospace; font-size:20px; color:#3fb950; opacity:.6; text-align:right; line-height:1.7; }
</style></head><body>
